#  UMBRA DOMUS · INTAKE WORKER · STAGE 1
#  Nothing secret lives in this file. ADMIN_KEY and the five alert secrets (PUSHOVER_TOKEN,
#  PUSHOVER_USER, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, HOOK_SECRET — see ALERTS-SETUP.md) are set with
#  `wrangler secret put` once, and read from worker/.dev.vars when running locally.
#  REMINDERS-01 adds a sixth, SMSGATE_AUTH — the whole "user:pass" pair SMSGate's app on the work phone
#  generated, kept in one secret and never split. Without it no holding text can go out and the Worker
#  pushes "no texting key on the website — call them" instead. His hand, once:
#      npx wrangler secret put SMSGATE_AUTH
#  worker/.dev.vars is git-ignored and must never be committed.

name = "umbra-intake"
main = "src/index.js"
# admin.html sits beside src/, so the module base is the worker folder.
base_dir = "."
compatibility_date = "2025-06-01"

# admin.html is a real file, imported as text so the Worker can serve it at /admin.
rules = [
  { type = "Text", globs = ["**/*.html"], fallthrough = false }
]

[vars]
# The site the confirmation and status links point at.
SITE_BASE_URL = "https://www.umbradomus.com"
# The Worker's own public address — Pushover calls back here when he taps Acknowledge.
# No alert carries a link (R25); this is only the callback's address.
PUBLIC_BASE_URL = "https://umbra-intake.umbradomus.workers.dev"
# The last job id already used on paper. U-0001 and U-0002 exist, so the first
# record this Worker creates is U-0003.
SEED_LAST_ID = "2"
# ACCEPT-PAGE-01: the quote link at the end of the text is QUOTE_LINK_BASE + "/q/" + <22-character code>.
# The shortest form of our own domain, for a text message; the site rewrites /q/* to this Worker.
QUOTE_LINK_BASE = "https://umbradomus.com"
# ACCEPT-PAGE-02: the before-you-accept notices on the customer's page (src/notices.js).
# The lighting paragraph shows by default. The Texas Property Code §53.255 disclosure shows only when
# NOTICE_53255 is "true". His call (QUOTE-PAGE-03, 2026-09-23): BOTH, with the disclosure collapsed behind one
# line so the page stays short ("make the disclosure there but collapsed"). The code's own default stays "false".
NOTICE_LIGHTING = "true"
NOTICE_53255 = "true"

# --- THE BOOK (ACCEPT-PAGE-01) ----------------------------------------------
# The quotes, their holds and one booking per time: a Durable Object with SQLite storage, reached as
# one named instance so every accept is serialized (src/quotebook.js). `wrangler deploy` creates it from
# the migration below — no other resource and no command. Always new_sqlite_classes, never the plain kind: the
# Workers Free plan takes only SQLite-backed Durable Objects.
[[durable_objects.bindings]]
name = "BOOK"
class_name = "QuoteBook"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuoteBook"]

# --- THE RECORD STORE -------------------------------------------------------
# Create with:  npx wrangler kv namespace create RECORDS
# then paste the id it prints over the placeholder below.
[[kv_namespaces]]
binding = "RECORDS"
id = "6ee39a58edfc419c9a61ec3b7d11dd99"

# --- THE PHOTOS -------------------------------------------------------------
# Create with:  npx wrangler r2 bucket create umbra-job-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "umbra-job-photos"

# --- THE ALERTS -------------------------------------------------------------
# Every 5 minutes (ALERTS-01; was every 15). src/alerts.js.
# REMINDERS-01 · HIS TABLE replaces the old ladder for every request that lands from now on, counted in
# business minutes from landing: 15/30/45/60, then 70/80/90, then 95/100/105/110/115 — one push each,
# priority 1 through minute 60 and priority 2 from 70. At minute 120 with no quote sent, the holding
# text goes to the customer through SMSGate (src/holding.js) and a second two-hour clock starts on the
# same table; at its end, one "CALL THEM NOW" push and the ladder ends for good. Nothing at all leaves
# 9 PM-7 AM, and the overnight wait still comes out as one 7:00 AM summary. Records that landed before
# this round keep ALERTS-01's own ladder (+15 priority 2, then every 30, one OVERDUE at the due time).
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
