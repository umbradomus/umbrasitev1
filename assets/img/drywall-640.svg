<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A patched wall ready for paint" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A patched wall ready for paint</title>

  <rect width="640" height="400" fill="#ECE7DF"/>

  <!-- the wall -->
  <rect x="96" y="44" width="448" height="312" fill="#F6F3EE" stroke="#003153" stroke-width="9"/>
  <!-- the seam between two sheets -->
  <path d="M320 44 V356" stroke="#D9D2C7" stroke-width="6"/>

  <!-- the patch: feathered compound, then the cut square inside it -->
  <rect x="180" y="116" width="196" height="168" rx="8" fill="#4FB87B" opacity=".2"/>
  <rect x="216" y="152" width="124" height="96" fill="#4FB87B" opacity=".38"/>
  <rect x="216" y="152" width="124" height="96" fill="none" stroke="#4FB87B" stroke-width="7"/>

  <!-- putty knife, blade first -->
  <g transform="rotate(-28 400 232)">
    <path d="M330 206 H452 V258 H330 L312 232Z" fill="#003153"/>
    <rect x="448" y="212" width="26" height="40" rx="6" fill="#003153"/>
    <rect x="470" y="216" width="108" height="32" rx="16" fill="#66023C"/>
    <rect x="492" y="226" width="64" height="6" rx="3" fill="#ECE7DF" opacity=".45"/>
  </g>

  <!-- a bead of compound left on the wall -->
  <path d="M150 316 q34 -22 68 0 q34 22 68 0" stroke="#4FB87B" stroke-width="8" stroke-linecap="round" fill="none" opacity=".55"/>
</svg>
