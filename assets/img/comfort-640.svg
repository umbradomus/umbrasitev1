<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Attic insulation and shade on a Valley home" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Attic insulation and shade on a Valley home</title>
  <defs>
    <clipPath id="attic"><path d="M320 96 486 200 154 200Z"/></clipPath>
  </defs>

  <rect width="640" height="400" fill="#ECE7DF"/>

  <!-- sun, upper right -->
  <g fill="#D9432B">
    <circle cx="512" cy="84" r="34"/>
    <rect x="506" y="18" width="12" height="26" rx="6"/>
    <rect x="566" y="78" width="26" height="12" rx="6"/>
    <rect x="452" y="127" width="26" height="12" rx="6" transform="rotate(-45 465 133)"/>
    <rect x="551" y="127" width="26" height="12" rx="6" transform="rotate(45 564 133)"/>
  </g>

  <!-- the shade line: the sun's reach, stopped by the awning -->
  <path d="M488 136 L306 218" stroke="#D9432B" stroke-width="7" stroke-linecap="round" stroke-dasharray="18 20" opacity=".5" fill="none"/>

  <!-- house -->
  <rect x="176" y="200" width="288" height="132" fill="#F6F3EE"/>
  <path d="M320 96 486 200 154 200Z" fill="#F6F3EE"/>

  <!-- insulation batts in the attic -->
  <g clip-path="url(#attic)" fill="#4FB87B">
    <rect x="140" y="178" width="360" height="16" rx="8"/>
    <rect x="140" y="156" width="360" height="16" rx="8"/>
    <rect x="140" y="134" width="360" height="16" rx="8"/>
    <rect x="140" y="112" width="360" height="16" rx="8"/>
  </g>
  <path d="M320 96 486 200 154 200Z" fill="none" stroke="#003153" stroke-width="9" stroke-linejoin="round"/>

  <!-- ceiling line, then the rooms below -->
  <path d="M176 200 H464" stroke="#003153" stroke-width="9" stroke-linecap="round"/>
  <rect x="176" y="200" width="288" height="132" fill="none" stroke="#003153" stroke-width="9" stroke-linejoin="round"/>

  <!-- window with an awning over it -->
  <rect x="222" y="244" width="82" height="62" fill="none" stroke="#003153" stroke-width="8"/>
  <path d="M263 244 V306 M222 275 H304" stroke="#003153" stroke-width="6"/>
  <path d="M212 238 H314 L296 216 H230Z" fill="#003153"/>

  <!-- door -->
  <rect x="360" y="252" width="62" height="80" fill="none" stroke="#003153" stroke-width="8"/>

  <!-- ground -->
  <rect x="96" y="332" width="448" height="9" rx="4.5" fill="#003153"/>
</svg>
